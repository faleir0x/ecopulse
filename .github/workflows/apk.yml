name: APK

# APK assinado do app (Android) anexado à Release da tag. Job 1: expo prebuild + Gradle, só
# arm64-v8a, sem acesso à keystore. Job 2: assina com apksigner e publica a Release.
#
# Segredos: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#           ANDROID_KEY_PASSWORD, GOOGLE_SERVICES_JSON_BASE64, GOOGLE_MAPS_ANDROID_KEY
# Variáveis: ECOPULSE_API_URL (https://...), ECOPULSE_WS_URL (wss://...)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Build (sem assinatura)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.ECOPULSE_API_URL }}
      EXPO_PUBLIC_WS_URL: ${{ vars.ECOPULSE_WS_URL }}
      GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Conferir segredos e variáveis
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          faltando=""
          for nome in GOOGLE_SERVICES GOOGLE_MAPS_ANDROID_KEY EXPO_PUBLIC_API_URL EXPO_PUBLIC_WS_URL; do
            [ -n "${!nome}" ] || faltando="$faltando $nome"
          done
          if [ -n "$faltando" ]; then echo "::error::faltando:$faltando"; exit 1; fi
      - name: Versão
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then versao="${GITHUB_REF_NAME#v}"; else versao="0.0.0-${GITHUB_SHA::7}"; fi
          echo "ECOPULSE_VERSAO=$versao" >> "$GITHUB_ENV"
          echo "ECOPULSE_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Sem cache em build de release (evita envenenamento de cache)
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - run: npm ci --no-audit --no-fund
      - name: google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES" | base64 -d > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"
      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install --clean
      - name: Gradle (release, arm64-v8a)
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: APK sem assinatura
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
          echo "APK_SEM_ASSINATURA=$RUNNER_TEMP/app-release.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-sem-assinatura
          path: ${{ env.APK_SEM_ASSINATURA }}
          if-no-files-found: error
          retention-days: 1

  assinar:
    # Job separado: a keystore nunca fica no mesmo runner em que rodaram npm ci, prebuild e
    # Gradle (código de terceiros que poderia deixar um processo vivo para ler o arquivo)
    name: Assinatura e Release
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-sem-assinatura
          path: ${{ runner.temp }}/entrada
      - name: Versão
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then versao="${GITHUB_REF_NAME#v}"; else versao="0.0.0-${GITHUB_SHA::7}"; fi
          echo "ECOPULSE_VERSAO=$versao" >> "$GITHUB_ENV"
      - name: Assinar
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for nome in KEYSTORE KS_PASS KEY_ALIAS KEY_PASS; do
            [ -n "${!nome}" ] || { echo "::error::faltando: $nome"; exit 1; }
          done
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/ecopulse.jks"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          saida="$RUNNER_TEMP/EcoPulse-$ECOPULSE_VERSAO.apk"
          # O APK do Gradle já sai alinhado; o apksigner troca a assinatura de debug pela nossa
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/ecopulse.jks" \
            --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "$saida" "$RUNNER_TEMP/entrada/app-release.apk"
          "$build_tools/apksigner" verify --print-certs "$saida" | grep -v "SHA-1\|MD5"
          rm -f "$RUNNER_TEMP/ecopulse.jks"
          echo "APK=$saida" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EcoPulse-${{ env.ECOPULSE_VERSAO }}
          path: ${{ env.APK }}
          if-no-files-found: error
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""; [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes $prerelease --title "EcoPulse $ECOPULSE_VERSAO"
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
