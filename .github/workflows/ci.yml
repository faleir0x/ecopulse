name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  python:
    name: Python (lint, tipos, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Ruff (lint + regras de segurança Bandit)
        run: uv run ruff check --output-format=github .
      - name: Ruff (formatação)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy packages services
      - name: Testes unitários
        run: uv run pytest -q

  integration:
    name: Integração (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --all-packages
      # Testes de integração rodam só com a infra: com o processor de pé, ele
      # consumiria das filas as mensagens que os testes publicam.
      - name: Subir infraestrutura
        working-directory: infra
        run: >-
          docker compose up -d --wait --wait-timeout 300
          rabbitmq postgres redis-1 redis-2 redis-3 redis-cluster-init
      - name: Testes de integração
        env:
          ECOPULSE_REDIS_REMAP_LOCALHOST: "true"
        run: uv run pytest -q -m integration
      - name: Subir serviços
        working-directory: infra
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: infra/smoke.sh
      - name: Logs em caso de falha
        if: failure()
        working-directory: infra
        run: docker compose logs --no-color --tail=200
      - name: Derrubar
        if: always()
        working-directory: infra
        run: docker compose down -v

  dependencies:
    name: Vulnerabilidades em dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pip-audit (base PyPI/OSV)
        run: |
          uv export --all-packages --no-emit-workspace --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit --strict --disable-pip -r /tmp/requirements.txt
      - name: Trivy (lockfiles, Dockerfiles e configuração)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: design
          exit-code: "1"

  secrets:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose

  sast:
    name: Análise estática (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: >-
          uvx semgrep scan --error --metrics=off
          --config p/python --config p/dockerfile --config p/docker-compose
          --exclude design

  images:
    name: Imagem ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: python
    strategy:
      fail-fast: false
      matrix:
        service: [api, processor]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: infra/docker/python.Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/python.Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          tags: ecopulse-${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Trivy (imagem)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecopulse-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
