name: ecopulse

x-redis-node: &redis-node
  image: redis:7.4-alpine
  restart: unless-stopped
  networks: [ecopulse]
  healthcheck:
    test: ["CMD-SHELL", "redis-cli -p $$REDIS_PORT ping"]
    interval: 5s
    timeout: 3s
    retries: 10

x-python-env: &python-env
  ECOPULSE_RABBIT_URL: amqp://ecopulse:ecopulse@rabbitmq:5672/
  # Dois nós: com target_session_attrs=read-write o asyncpg conecta só no que aceita escrita, então
  # depois de promover a réplica as conexões novas vão para ela sozinhas (infra/demo/falha-postgres.sh)
  ECOPULSE_DATABASE_URL: postgresql://ecopulse:ecopulse@postgres:5432,postgres-2:5432/ecopulse?target_session_attrs=read-write
  ECOPULSE_REDIS_NODES: redis-1:7001,redis-2:7002,redis-3:7003

x-python-service: &python-service
  build:
    context: ..
    dockerfile: infra/docker/python.Dockerfile
  networks: [ecopulse]
  restart: unless-stopped
  # Endurecimento: sem privilégios novos nem capabilities, sistema de arquivos só de leitura
  # (só /tmp gravável) e limites de memória e processos
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 384m
  pids_limit: 256
  environment: *python-env
  depends_on:
    rabbitmq: { condition: service_healthy }
    postgres: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
    redis-cluster-init: { condition: service_completed_successfully }
    # Política das filas de retry aplicada antes dos consumidores (e o --wait do CI não trata
    # o container que termina como falha)
    rabbitmq-politicas: { condition: service_completed_successfully }

services:
  # RabbitMQ em cluster (3 nós) com filas quorum; os serviços falam com o HAProxy
  rabbitmq-1:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    hostname: rabbitmq-1
    networks: [ecopulse]
    environment:
      # Mesmo cookie Erlang nos 3 nós (só para a rede local do compose)
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie ${RABBITMQ_COOKIE:-ecopulse-cookie-local}
      RABBITMQ_CTL_ERL_ARGS: -setcookie ${RABBITMQ_COOKIE:-ecopulse-cookie-local}
    volumes:
      - rabbitmq_1:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      # O CLI sobe uma VM Erlang a cada checagem: com a máquina carregada passa de 5 s
      timeout: 15s
      retries: 18

  rabbitmq-2:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    hostname: rabbitmq-2
    networks: [ecopulse]
    environment:
      # Mesmo cookie Erlang nos 3 nós (só para a rede local do compose)
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie ${RABBITMQ_COOKIE:-ecopulse-cookie-local}
      RABBITMQ_CTL_ERL_ARGS: -setcookie ${RABBITMQ_COOKIE:-ecopulse-cookie-local}
    volumes:
      - rabbitmq_2:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      # O CLI sobe uma VM Erlang a cada checagem: com a máquina carregada passa de 5 s
      timeout: 15s
      retries: 18

  rabbitmq-3:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    hostname: rabbitmq-3
    networks: [ecopulse]
    environment:
      # Mesmo cookie Erlang nos 3 nós (só para a rede local do compose)
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -setcookie ${RABBITMQ_COOKIE:-ecopulse-cookie-local}
      RABBITMQ_CTL_ERL_ARGS: -setcookie ${RABBITMQ_COOKIE:-ecopulse-cookie-local}
    volumes:
      - rabbitmq_3:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      # O CLI sobe uma VM Erlang a cada checagem: com a máquina carregada passa de 5 s
      timeout: 15s
      retries: 18

  rabbitmq:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    networks: [ecopulse]
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - ./rabbitmq/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      rabbitmq-1: { condition: service_healthy }
      rabbitmq-2: { condition: service_healthy }
      rabbitmq-3: { condition: service_healthy }

  # Política das filas de retry: dead-letter "at-least-once" (o padrão das filas quorum é
  # at-most-once). Política e não argumento: argumento de fila existente não pode mudar.
  rabbitmq-politicas:
    image: rabbitmq:3.13-management
    networks: [ecopulse]
    restart: "no"
    environment:
      RABBITMQ_CTL_ERL_ARGS: -setcookie ${RABBITMQ_COOKIE:-ecopulse-cookie-local}
    entrypoint:
      - rabbitmqctl
      - -n
      - rabbit@rabbitmq-1
      - set_policy
      - --apply-to
      - quorum_queues
      - retry-pelo-menos-uma
      - ^relatos\.retry\.
      - '{"dead-letter-strategy":"at-least-once","overflow":"reject-publish"}'
    depends_on:
      rabbitmq-1: { condition: service_healthy }

  # PostgreSQL primário + réplica por streaming (postgres-2, hot standby). Failover manual:
  # promover a réplica (pg_promote); wal_log_hints permite o pg_rewind na volta.
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    networks: [ecopulse]
    command: &postgres-cmd
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - wal_log_hints=on
      - -c
      - wal_keep_size=512MB
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ecopulse
      POSTGRES_PASSWORD: ecopulse
      POSTGRES_DB: ecopulse
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ecopulse -d ecopulse"]  # TCP: ignora o servidor temporário do initdb
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-2:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    networks: [ecopulse]
    entrypoint: ["/replica.sh"]
    command: *postgres-cmd
    ports:
      - "127.0.0.1:${POSTGRES_REPLICA_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ecopulse
      POSTGRES_PASSWORD: ecopulse
      POSTGRES_DB: ecopulse
      PRIMARIO: postgres
    volumes:
      - pg_data_2:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/replica.sh:/replica.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ecopulse -d ecopulse"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      # o usuário replicador vem da migração 0003
      migrate: { condition: service_completed_successfully }

  # Aplica as migrações pendentes (postgres/migracoes) e termina; os serviços esperam por ele.
  # Banco de testes: docker compose run --rm -e PGDATABASE=ecopulse_teste migrate
  migrate:
    image: postgis/postgis:16-3.4
    networks: [ecopulse]
    restart: "no"
    entrypoint: ["sh", "/migrar.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ecopulse
      PGPASSWORD: ecopulse
      PGDATABASE: ecopulse
      PGOPTIONS: -c client_min_messages=warning
    volumes:
      - ./postgres/migrar.sh:/migrar.sh:ro
      - ./postgres/migracoes:/migracoes:ro
    depends_on:
      postgres: { condition: service_healthy }

  # Redis Cluster: 3 mestres + 3 réplicas, IPs fixos para o cluster sobreviver a reinícios.
  # Os nós se anunciam pelo hostname; fora do Docker, use ECOPULSE_REDIS_REMAP_LOCALHOST=true.
  redis-1:
    <<: *redis-node
    environment: { REDIS_PORT: 7001 }
    command: >-
      redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-announce-hostname redis-1 --cluster-preferred-endpoint-type hostname
      --cluster-node-timeout 5000
      --appendonly yes
    ports: ["127.0.0.1:7001:7001"]
    networks: { ecopulse: { ipv4_address: 10.89.70.11 } }
    volumes: [redis_1:/data]

  redis-2:
    <<: *redis-node
    environment: { REDIS_PORT: 7002 }
    command: >-
      redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-announce-hostname redis-2 --cluster-preferred-endpoint-type hostname
      --cluster-node-timeout 5000
      --appendonly yes
    ports: ["127.0.0.1:7002:7002"]
    networks: { ecopulse: { ipv4_address: 10.89.70.12 } }
    volumes: [redis_2:/data]

  redis-3:
    <<: *redis-node
    environment: { REDIS_PORT: 7003 }
    command: >-
      redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-announce-hostname redis-3 --cluster-preferred-endpoint-type hostname
      --cluster-node-timeout 5000
      --appendonly yes
    ports: ["127.0.0.1:7003:7003"]
    networks: { ecopulse: { ipv4_address: 10.89.70.13 } }
    volumes: [redis_3:/data]

  redis-4:
    <<: *redis-node
    environment: { REDIS_PORT: 7004 }
    command: >-
      redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-announce-hostname redis-4 --cluster-preferred-endpoint-type hostname
      --cluster-node-timeout 5000
      --appendonly yes
    ports: ["127.0.0.1:7004:7004"]
    networks: { ecopulse: { ipv4_address: 10.89.70.14 } }
    volumes: [redis_4:/data]

  redis-5:
    <<: *redis-node
    environment: { REDIS_PORT: 7005 }
    command: >-
      redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-announce-hostname redis-5 --cluster-preferred-endpoint-type hostname
      --cluster-node-timeout 5000
      --appendonly yes
    ports: ["127.0.0.1:7005:7005"]
    networks: { ecopulse: { ipv4_address: 10.89.70.15 } }
    volumes: [redis_5:/data]

  redis-6:
    <<: *redis-node
    environment: { REDIS_PORT: 7006 }
    command: >-
      redis-server --port 7006 --cluster-enabled yes --cluster-config-file nodes.conf
      --cluster-announce-hostname redis-6 --cluster-preferred-endpoint-type hostname
      --cluster-node-timeout 5000
      --appendonly yes
    ports: ["127.0.0.1:7006:7006"]
    networks: { ecopulse: { ipv4_address: 10.89.70.16 } }
    volumes: [redis_6:/data]

  redis-cluster-init:
    image: redis:7.4-alpine
    networks: [ecopulse]
    volumes: ["./redis/cluster-init.sh:/cluster-init.sh:ro"]
    entrypoint: ["sh", "/cluster-init.sh"]
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redis-4: { condition: service_healthy }
      redis-5: { condition: service_healthy }
      redis-6: { condition: service_healthy }

  api:
    <<: *python-service
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      args: { SERVICE: api }
    command: ["uvicorn", "ecopulse_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *python-env
      # chave do OpenRouteService só no servidor (nunca vai ao app)
      ECOPULSE_ORS_API_KEY: ${ORS_API_KEY:-}
      ECOPULSE_PROXIES_CONFIAVEIS: 10.89.70.250
    healthcheck:
      # python em vez de curl: a imagem slim não tem curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${API_PORT:-8000}:8000"

  processor:
    <<: *python-service
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      args: { SERVICE: processor }
    command: ["python", "-m", "ecopulse_processor"]

  environment:
    <<: *python-service
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      args: { SERVICE: environment }
    command: ["python", "-m", "ecopulse_environment"]
    environment:
      <<: *python-env
      # "open-meteo" (real), "simulador" ou "simulador-calor" (demo)
      ECOPULSE_AMBIENTE_FONTE: ${AMBIENTE_FONTE:-open-meteo}

  realtime:
    <<: *python-service
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      args: { SERVICE: realtime }
    # Frames de no máximo 4 KB: o protocolo só tem subscribe (até 50 células) e ping
    command: ["uvicorn", "ecopulse_realtime.main:app", "--host", "0.0.0.0", "--port", "8000", "--ws-max-size", "4096"]
    healthcheck:
      # python em vez de curl: a imagem slim não tem curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${REALTIME_PORT:-8002}:8000"

  # Push remoto (FCM). Lê a conta de serviço do Firebase em secrets/firebase.json (arquivo 600
  # do dono do repositório, por isso roda com o uid dele em vez do 10001 da imagem); sem o
  # arquivo, roda em modo simulado e só registra no log o que enviaria.
  notifier:
    <<: *python-service
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      args: { SERVICE: notifier }
    command: ["python", "-m", "ecopulse_notifier"]
    user: "${ECOPULSE_UID:-1000}"
    volumes:
      - ./secrets:/run/secrets/ecopulse:ro

  # Cloudflare Tunnel (só para testes fora da rede local): api.faleir0x.com → api:8000,
  # rt.faleir0x.com → realtime:8000. Sobe só com --profile tunel; o token fica no .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run"]
    profiles: [tunel]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    # IP fixo: a API só confia no CF-Connecting-IP vindo daqui
    networks: { ecopulse: { ipv4_address: 10.89.70.250 } }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      realtime: { condition: service_healthy }

networks:
  ecopulse:
    ipam:
      config:
        - subnet: 10.89.70.0/24

volumes:
  pg_data_2:
  rabbitmq_1:
  rabbitmq_2:
  rabbitmq_3:
  pg_data:
  redis_1:
  redis_2:
  redis_3:
  redis_4:
  redis_5:
  redis_6:
