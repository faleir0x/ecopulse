# Balanceador na frente do cluster RabbitMQ: os serviços conectam em haproxy:5672 e,
# se um nó cair, a reconexão robusta do aio-pika cai num nó vivo.
global
  maxconn 4096

# DNS interno do Docker: no Swarm (e a cada recriação no compose) o IP de um nó muda; o HAProxy
# resolve os nomes de novo em vez de ficar preso ao IP da subida.
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

defaults
  mode tcp
  default-server init-addr last,libc,none resolvers docker
  timeout connect 5s
  timeout client 3h
  timeout server 3h

frontend amqp
  bind :5672
  default_backend rabbitmq_amqp

backend rabbitmq_amqp
  balance leastconn
  option tcp-check
  server rabbitmq-1 rabbitmq-1:5672 check inter 2s fall 2 rise 2
  server rabbitmq-2 rabbitmq-2:5672 check inter 2s fall 2 rise 2
  server rabbitmq-3 rabbitmq-3:5672 check inter 2s fall 2 rise 2

frontend painel
  bind :15672
  mode http
  default_backend rabbitmq_painel

backend rabbitmq_painel
  mode http
  balance roundrobin
  option httpchk GET /
  server rabbitmq-1 rabbitmq-1:15672 check inter 3s
  server rabbitmq-2 rabbitmq-2:15672 check inter 3s
  server rabbitmq-3 rabbitmq-3:15672 check inter 3s
