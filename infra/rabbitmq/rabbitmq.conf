# Cluster de 3 nós formado na subida (peer discovery fixo pelos hostnames do compose)
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3
# Se um nó cair, os outros dois continuam com maioria (quorum queues precisam de 2 de 3)
cluster_partition_handling = pause_minority
default_user = ecopulse
default_pass = ecopulse
loopback_users = none
# Líderes das filas quorum espalhados pelos nós (balanceamento entre nós do cluster)
queue_leader_locator = balanced
