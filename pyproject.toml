[project]
name = "ecopulse"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos do português em strings/comentários

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/common/src", "services/api/src", "services/processor/src", "services/realtime/src", "services/environment/src", "services/notifier/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: precisa da infra do docker compose rodando",
  "e2e: precisa da stack inteira no ar (docker compose up)",
]
addopts = "-m 'not integration and not e2e' --import-mode=importlib"

[tool.ruff.lint.isort]
known-first-party = ["ecopulse_common", "ecopulse_api", "ecopulse_processor", "ecopulse_realtime", "ecopulse_environment"]
