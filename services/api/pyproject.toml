[project]
name = "ecopulse-api"
version = "0.1.0"
description = "API HTTP: recebe comandos e atende leituras"
requires-python = ">=3.13"
dependencies = [
  "ecopulse-common",
  "fastapi>=0.162.4",
  "httpx>=0.28",
  "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
ecopulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecopulse_api"]
