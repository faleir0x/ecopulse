[project]
name = "ecopulse-notifier"
version = "0.1.0"
description = "Push remoto (FCM): consome ocorrencia.* e avisa os aparelhos no raio, mesmo com o app fechado"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46",
    "ecopulse-common",
    "httpx>=0.28",
]

[tool.uv.sources]
ecopulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecopulse_notifier"]
