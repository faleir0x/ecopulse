[project]
name = "ecopulse-processor"
version = "0.1.0"
description = "Worker: consome relatos, agrupa em ocorrências e grava eventos na outbox"
requires-python = ">=3.13"
dependencies = ["ecopulse-common"]

[tool.uv.sources]
ecopulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecopulse_processor"]
