[project]
name = "ecopulse-realtime"
version = "0.1.0"
description = "WebSocket: entrega alertas de ocorrência por célula geohash"
requires-python = ">=3.13"
dependencies = [
  "ecopulse-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
ecopulse-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecopulse_realtime"]
